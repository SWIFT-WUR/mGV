<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1f2937">
  <title>Sub-basin routing</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <g id="comb">
      <!-- sub-steps inside a workgroup -->
      <path d="M0,0 v8 M8,0 v8 M16,0 v8 M24,0 v8 M32,0 v8 M40,0 v8 M48,0 v8 M56,0 v8 M64,0 v8 M72,0 v8 M80,0 v8 M88,0 v8" stroke="currentColor" stroke-width="2"/>
    </g>
  </defs>

  <rect width="960" height="500" fill="#ffffff"/>

  <!-- ===================== Panel 1: the network ===================== -->
  <text x="20" y="30" font-size="15" font-weight="bold">1. Split the river network into sub-basins</text>
  <text x="20" y="48" fill="#4b5563">of at most S cells each (e.g. 2048)</text>

  <!-- sub-basin outlines -->
  <ellipse cx="98" cy="113" rx="62" ry="22" transform="rotate(41 98 113)" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-dasharray="4 3"/>
  <ellipse cx="242" cy="113" rx="62" ry="22" transform="rotate(-41 242 113)" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-dasharray="4 3"/>
  <ellipse cx="170" cy="215" rx="22" ry="60" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <ellipse cx="262" cy="273" rx="62" ry="22" transform="rotate(-38 262 273)" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <ellipse cx="170" cy="345" rx="22" ry="60" fill="#10b981" fill-opacity="0.14" stroke="#10b981" stroke-dasharray="4 3"/>

  <!-- flow links between cells -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#flow)">
    <path d="M60,80 L81,98"/><path d="M85,102 L106,120"/><path d="M110,124 L131,142"/><path d="M135,146 L163,166"/>
    <path d="M280,80 L259,98"/><path d="M255,102 L234,120"/><path d="M230,124 L209,142"/><path d="M205,146 L177,166"/>
    <path d="M170,176 v18"/><path d="M170,206 v18"/><path d="M170,236 v18"/><path d="M170,266 v28"/>
    <path d="M170,306 v18"/><path d="M170,336 v18"/><path d="M170,366 v18"/><path d="M170,396 v26"/>
    <path d="M300,240 L276,258"/><path d="M272,262 L248,280"/><path d="M244,284 L220,302"/><path d="M216,306 L180,326"/>
  </g>

  <!-- cells -->
  <g stroke="#ffffff" stroke-width="1.5">
    <g fill="#3b82f6">
      <circle cx="60" cy="80" r="7"/><circle cx="85" cy="102" r="7"/><circle cx="110" cy="124" r="7"/><circle cx="135" cy="146" r="7"/>
      <circle cx="280" cy="80" r="7"/><circle cx="255" cy="102" r="7"/><circle cx="230" cy="124" r="7"/><circle cx="205" cy="146" r="7"/>
    </g>
    <g fill="#f59e0b">
      <circle cx="170" cy="170" r="7"/><circle cx="170" cy="200" r="7"/><circle cx="170" cy="230" r="7"/><circle cx="170" cy="260" r="7"/>
      <circle cx="300" cy="240" r="7"/><circle cx="272" cy="262" r="7"/><circle cx="244" cy="284" r="7"/><circle cx="216" cy="306" r="7"/>
    </g>
    <g fill="#10b981">
      <circle cx="170" cy="300" r="7"/><circle cx="170" cy="330" r="7"/><circle cx="170" cy="360" r="7"/><circle cx="170" cy="390" r="7"/>
    </g>
  </g>

  <!-- sub-basin names -->
  <g font-weight="bold" font-size="15">
    <text x="48" y="128">A</text>
    <text x="284" y="128">B</text>
    <text x="198" y="214">D</text>
    <text x="300" y="296">C</text>
    <text x="198" y="352">E</text>
  </g>
  <text x="170" y="440" text-anchor="middle" fill="#4b5563">outlet</text>

  <!-- legend -->
  <g transform="translate(20,462)">
    <circle cx="6" cy="0" r="6" fill="#3b82f6"/><text x="18" y="4">level 1</text>
    <circle cx="86" cy="0" r="6" fill="#f59e0b"/><text x="98" y="4">level 2</text>
    <circle cx="166" cy="0" r="6" fill="#10b981"/><text x="178" y="4">level 3</text>
  </g>
  <text x="20" y="486" fill="#4b5563" font-size="12">A sub-basin runs after everything upstream of it.</text>

  <line x1="345" y1="20" x2="345" y2="480" stroke="#e5e7eb"/>

  <!-- ===================== Panel 2: the GPU ===================== -->
  <text x="370" y="30" font-size="15" font-weight="bold">2. One kernel launch per level, one workgroup per sub-basin</text>
  <text x="370" y="48" fill="#4b5563">each workgroup runs all 144 sub-steps of the day with its cells on-chip</text>

  <!-- launch columns -->
  <g fill="#f8fafc" stroke="#cbd5e1">
    <rect x="370" y="66" width="160" height="214" rx="8"/>
    <rect x="580" y="66" width="160" height="214" rx="8"/>
    <rect x="790" y="66" width="150" height="214" rx="8"/>
  </g>
  <g font-weight="bold" text-anchor="middle">
    <text x="450" y="86">launch 1 · level 1</text>
    <text x="660" y="86">launch 2 · level 2</text>
    <text x="865" y="86">launch 3 · level 3</text>
  </g>

  <!-- workgroups -->
  <g stroke-width="1.5">
    <rect x="385" y="100" width="130" height="64" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="385" y="190" width="130" height="64" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
    <rect x="595" y="100" width="130" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <rect x="595" y="190" width="130" height="64" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
    <rect x="800" y="145" width="130" height="64" rx="6" fill="#d1fae5" stroke="#10b981"/>
  </g>
  <g font-weight="bold">
    <text x="395" y="120">A</text><text x="395" y="210">B</text>
    <text x="605" y="120">D</text><text x="605" y="210">C</text>
    <text x="810" y="165">E</text>
  </g>
  <g fill="#4b5563" font-size="11">
    <text x="410" y="120">workgroup</text><text x="410" y="210">workgroup</text>
    <text x="620" y="120">workgroup</text><text x="620" y="210">workgroup</text>
    <text x="825" y="165">workgroup</text>
  </g>
  <g>
    <use href="#comb" x="400" y="130" color="#3b82f6"/><use href="#comb" x="400" y="220" color="#3b82f6"/>
    <use href="#comb" x="610" y="130" color="#f59e0b"/><use href="#comb" x="610" y="220" color="#f59e0b"/>
    <use href="#comb" x="815" y="175" color="#10b981"/>
  </g>
  <g fill="#4b5563" font-size="11">
    <text x="400" y="155">t = 1 … 144</text><text x="400" y="245">t = 1 … 144</text>
    <text x="610" y="155">t = 1 … 144</text><text x="610" y="245">t = 1 … 144</text>
    <text x="815" y="200">t = 1 … 144</text>
  </g>

  <!-- outlet records -->
  <g stroke="#374151" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M515,132 L593,132"/>
    <path d="M515,222 C555,222 555,150 593,145"/>
    <path d="M725,132 C765,132 765,170 798,172"/>
    <path d="M725,222 C765,222 765,190 798,186"/>
  </g>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <text x="554" y="126">Q(t)</text>
    <text x="764" y="126">Q(t)</text>
  </g>

  <!-- explanation -->
  <g font-size="13">
    <text x="370" y="312" font-weight="bold">Inside a workgroup</text>
    <text x="370" y="330">Every sub-step, each cell adds the inflow from its upstream cells</text>
    <text x="370" y="347">at t − 1, updates its storage and discharge, then all wait at a barrier.</text>

    <text x="370" y="377" font-weight="bold">Between workgroups</text>
    <text x="370" y="395">An upstream sub-basin finishes all 144 sub-steps first and passes on</text>
    <text x="370" y="412">only its outlet discharge at every sub-step, Q(t) (arrows).</text>

    <text x="370" y="442" font-weight="bold">Rescheduling</text>
    <text x="370" y="460">C could run in level 1, but E only needs it before level 3. Moving it</text>
    <text x="370" y="477">to level 2 fills a free slot, so every launch keeps the GPU busy.</text>
  </g>
</svg>
