name = "mGVApp"
uuid = "f76e5b31-6613-4317-b203-5d4ecd4cce08"
version = "0.1.0"

[deps]
ArgParse = "c7e460c6-2fb9-53a9-8c5b-16f535851c63"
mGV = "b1af0ff3-f930-4051-bc19-f789759b7f7a"

# Pkg installs an app in an environment of its own, where a relative path to mGV does not
# work. mGV is not registered, so get it from GitHub.
[sources]
mGV = {url = "https://github.com/SWIFT-WUR/mGV", rev = "main"}

[compat]
ArgParse = "1.2"
julia = "1.12"

[apps.mGV]
julia_flags = ["--threads=auto"]
